name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/library-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/library-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/library-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/library-backend:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/library-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/library-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/library-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/library-frontend:buildcache,mode=max

      - name: Success notification
        if: success() && github.event_name == 'push'
        run: |
          echo "✅ Docker images pushed to Docker Hub!"
          echo "Backend: ${{ secrets.DOCKER_USERNAME }}/library-backend:latest"
          echo "Frontend: ${{ secrets.DOCKER_USERNAME }}/library-frontend:latest"
